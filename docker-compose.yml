services:
  # =====================================================================
  # 1. Cơ sở dữ liệu MySQL 8.0 (Quản lý 3 DB: auth_db, warehouse_db, supplier_db)
  # =====================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - syncstock-network

  # =====================================================================
  # 2. Message Broker RabbitMQ 3 Management
  # =====================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - syncstock-network

  # =====================================================================
  # 3. Auth Service (Container 8080, DB: auth_db, User: auth_user)
  # =====================================================================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${AUTH_DB_USER:-auth_user}
      - SPRING_DATASOURCE_PASSWORD=${AUTH_DB_PASSWORD:-auth_password}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=QuanLyKho.AuthService
      - JWT_AUDIENCE=QuanLyKho.Client
      - JWT_EXPIRATION_MS=3600000
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - syncstock-network

  # =====================================================================
  # 4. Inventory Service (Container 8080, DB: warehouse_db, User: inventory_user)
  # =====================================================================
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/warehouse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${INVENTORY_DB_USER:-inventory_user}
      - SPRING_DATASOURCE_PASSWORD=${INVENTORY_DB_PASSWORD:-inventory_password}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=QuanLyKho.AuthService
      - JWT_AUDIENCE=QuanLyKho.Client
      - JWT_EXPIRATION_MS=3600000
      - UPLOAD_DIR=uploads/images
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - syncstock-network

  # =====================================================================
  # 5. Supplier Service (Container 8080, DB: supplier_db, User: supplier_user)
  # =====================================================================
  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    container_name: supplier-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/supplier_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=${SUPPLIER_DB_USER:-supplier_user}
      - SPRING_DATASOURCE_PASSWORD=${SUPPLIER_DB_PASSWORD:-supplier_password}
      - INVENTORY_SERVICE_URL=http://inventory-service:8080
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=QuanLyKho.AuthService
      - JWT_AUDIENCE=QuanLyKho.Client
      - JWT_EXPIRATION_MS=3600000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - syncstock-network

  # =====================================================================
  # 6. Report Service (Container 8080)
  # =====================================================================
  report-service:
    build:
      context: .
      dockerfile: report-service/Dockerfile
    container_name: report-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - INVENTORY_SERVICE_URL=http://inventory-service:8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=QuanLyKho.AuthService
      - JWT_AUDIENCE=QuanLyKho.Client
      - JWT_EXPIRATION_MS=3600000
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - syncstock-network

  # =====================================================================
  # 7. AI Service (Container 8080, Tích hợp Groq LLM)
  # =====================================================================
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - INVENTORY_SERVICE_URL=http://inventory-service:8080
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=QuanLyKho.AuthService
      - JWT_AUDIENCE=QuanLyKho.Client
      - JWT_EXPIRATION_MS=3600000
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - syncstock-network

  # =====================================================================
  # 8. API Gateway (Cổng Host 5000 -> Container 8080, Điểm vào duy nhất cho FE)
  # =====================================================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - SERVER_PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:8080
      - INVENTORY_SERVICE_URL=http://inventory-service:8080
      - SUPPLIER_SERVICE_URL=http://supplier-service:8080
      - REPORT_SERVICE_URL=http://report-service:8080
      - AI_SERVICE_URL=http://ai-service:8080
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173
    depends_on:
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - syncstock-network

# =====================================================================
# Mạng và Volumes lưu trữ dữ liệu bền vững
# =====================================================================
networks:
  syncstock-network:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
